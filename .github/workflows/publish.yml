name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - name: Diagnose npm identity
        run: |
          echo "=== npm profile get ==="
          npm profile get 2>&1 || true
          echo "=== npm token ls ==="
          npm token ls 2>&1 || true
      - name: Publish
        run: npm publish --access public