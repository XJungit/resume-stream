name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - name: Verify npm auth (diagnostic)
        run: |
          echo "NODE_AUTH_TOKEN is ${NODE_AUTH_TOKEN:+SET}${NODE_AUTH_TOKEN:-EMPTY}"
          npm whoami
      - name: Publish
        run: npm publish